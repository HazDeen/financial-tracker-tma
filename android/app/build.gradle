plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
android {
    namespace 'xyz.hazdeen.finance'
    compileSdk 35
    defaultConfig {
        applicationId 'xyz.hazdeen.finance'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes { release { if (signingFile.exists()) signingConfig signingConfigs.release; minifyEnabled false } }
}
